apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: lab-app
  labels:
    app: nginx-demo
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab-app
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgres
